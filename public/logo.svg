<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="pg-grad-saffron" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF9933"/>
      <stop offset="100%" stop-color="#EA580C"/>
    </linearGradient>
    <linearGradient id="pg-grad-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#4F46E5"/>
    </linearGradient>
    <linearGradient id="pg-grad-emerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="pg-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Rounded Base -->
  <rect x="4" y="4" width="92" height="92" rx="24" fill="#0B0F19" stroke="url(#pg-grad-saffron)" stroke-width="2" stroke-opacity="0.4"/>
  
  <!-- Subtle Background Grid Pattern -->
  <path d="M22 20v60M36 20v60M50 20v60M64 20v60M78 20v60 M20 22h60M20 36h60M20 50h60M20 64h60M20 78h60" stroke="#334155" stroke-width="0.8" stroke-dasharray="2 3" opacity="0.4"/>

  <!-- Pragati Grid Isometric Nodes & Matrix Lines -->
  <!-- Bottom Left Node: Emerald (Environment & Civil) -->
  <circle cx="28" cy="70" r="7" fill="url(#pg-grad-emerald)"/>
  
  <!-- Top Center Node: Saffron (Energy, Vision & Progress) -->
  <circle cx="50" cy="24" r="8" fill="url(#pg-grad-saffron)" filter="url(#pg-glow)"/>
  
  <!-- Bottom Right Node: Cobalt (Software & Systems) -->
  <circle cx="72" cy="70" r="7" fill="url(#pg-grad-blue)"/>
  
  <!-- Central Hub: Engineering Core -->
  <rect x="42" y="44" width="16" height="16" rx="4" transform="rotate(45 50 52)" fill="#1E293B" stroke="url(#pg-grad-saffron)" stroke-width="2"/>
  <circle cx="50" cy="52" r="3.5" fill="#FFFFFF"/>

  <!-- Interconnecting Quantum Data Lines -->
  <path d="M50 32 L50 40 M28 63 L44 55 M72 63 L56 55" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" opacity="0.9"/>
  <path d="M28 70 L72 70" stroke="url(#pg-grad-blue)" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
  <path d="M33 66 L47 30 M67 66 L53 30" stroke="url(#pg-grad-saffron)" stroke-width="1.8" stroke-dasharray="3 3" opacity="0.8"/>

  <!-- Pulse Sparks -->
  <circle cx="50" cy="24" r="2.5" fill="#FFF"/>
  <circle cx="28" cy="70" r="2" fill="#FFF"/>
  <circle cx="72" cy="70" r="2" fill="#FFF"/>
</svg>
